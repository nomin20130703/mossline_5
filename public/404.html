<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Mossline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #10291a;
        --ink2: #2c4434;
        --mist: #e7ebe8;
        --lime: #c6f35c;
        --lime2: #a9dd3a;
        --sans: "Manrope", "Helvetica Neue", Arial, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--mist);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
        font-size: 21px;
        margin-bottom: 40px;
      }

      .brand:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 6px;
        border-radius: 6px;
      }

      .card {
        width: 100%;
        max-width: 520px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 24px;
        padding: 4px 10px;
        border-radius: 3px;
        background: var(--lime);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 18px 0 0;
        font-size: clamp(26px, 4vw, 38px);
        font-weight: 600;
        line-height: 1.2;
        color: var(--ink);
        overflow-wrap: break-word;
      }

      p {
        margin: 14px auto 0;
        max-width: 440px;
        font-size: 15px;
        line-height: 1.55;
        color: var(--ink2);
        overflow-wrap: break-word;
      }

      .action {
        margin-top: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 22px;
        border-radius: 8px;
        background: var(--ink);
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.3;
        overflow-wrap: break-word;
        transition: background-color 0.2s ease, transform 0.2s ease;
      }

      .action:hover {
        background: var(--ink2);
      }

      .action:focus-visible {
        outline: 3px solid var(--lime2);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="brand" href="/">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2l12 7v14l-12 7-12-7V9z" fill="currentColor" />
          <path
            d="M16 8c-4 4-5 9-1 16 1-5 4-9 8-11-3 0-5 1-7 3 0-3 0-5 0-8z"
            fill="#c6f35c"
          />
        </svg>
        <span>Mossline</span>
      </a>

      <section class="card">
        <span class="chip">404</span>
        <h1>Энэ хуудас олдсонгүй.</h1>
        <p>Хаяг буруу эсвэл хуудас өөр газар шилжсэн байж болно.</p>
        <a class="action" href="/">Нүүр хуудас руу буцах</a>
      </section>
    </main>
  </body>
</html>
